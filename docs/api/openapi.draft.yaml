# DRAFT API contract written by the frontend.
# The backend (built by another person, their choice of stack) must satisfy this, or change it by agreement.
# Rules: money = integer cents; instants = UTC ISO 8601; exact address only after a booking is confirmed.
openapi: 3.1.0
info:
  title: ParkApp API (draft)
  version: 0.1.0
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Service health
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /api/venues:
    get:
      operationId: listVenues
      summary: Event venues ParkApp operates around
      responses:
        '200':
          description: Venues
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Venue' }

  /api/venues/{venueId}/events:
    get:
      operationId: listVenueEvents
      summary: Upcoming events at a venue
      parameters:
        - { name: venueId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Upcoming events, soonest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/VenueEvent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/venues/{venueId}/spaces:
    get:
      operationId: searchSpaces
      summary: Spaces within 3 km of a venue, with availability for a time window
      description: Poll this every few seconds for near real-time availability (no WebSockets).
      parameters:
        - { name: venueId, in: path, required: true, schema: { type: string } }
        - { name: startsAt, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: endsAt, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Spaces sorted by distance to the venue
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SpaceSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /api/spaces/{spaceId}:
    get:
      operationId: getSpace
      summary: Space detail (no exact address)
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Space
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Space' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/spaces/{spaceId}/reviews:
    get:
      operationId: listSpaceReviews
      summary: Reviews of a space, newest first
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Review' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/spaces/{spaceId}/quote:
    get:
      operationId: quoteSpace
      summary: Price for a time window (computed by the server, never by the client)
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string } }
        - { name: startsAt, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: endsAt, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /api/bookings:
    get:
      operationId: listMyBookings
      summary: The signed-in driver's bookings, newest first
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Bookings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createBooking
      summary: Hold a space while the driver pays (pre-booking expires at expiresAt)
      description: >
        Requires a complete account: personal data, at least one vehicle and a verified identity.
        Otherwise 403 with code profile_incomplete, vehicle_required or identity_required.
        422 vehicle_not_supported when the vehicle type does not fit the space,
        422 own_space when the driver is the host of that space.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingCreate' }
      responses:
        '201':
          description: Held. Status is pending_payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The space is already booked for part of that window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Invalid' }

  /api/bookings/{bookingId}:
    get:
      operationId: getBooking
      summary: One of the signed-in driver's bookings
      security: [{ bearer: [] }]
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/bookings/{bookingId}/confirm:
    post:
      operationId: confirmBooking
      summary: Confirm after payment succeeded; reveals the exact address and access code
      security: [{ bearer: [] }]
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentIntentId]
              properties:
                paymentIntentId: { type: string }
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The pre-booking expired or was cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/bookings/{bookingId}/cancel:
    post:
      operationId: cancelBooking
      summary: Cancel a booking (free until 10 minutes before it starts)
      security: [{ bearer: [] }]
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Too late to cancel, or already cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/me:
    get:
      operationId: getMe
      summary: The signed-in user
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateMe
      summary: Update language preference
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language: { type: string, enum: [es-MX, en] }
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/me/profile:
    put:
      operationId: updateProfile
      summary: Save the driver's personal data and accept the privacy notice
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Invalid' }

  /api/me/vehicles:
    post:
      operationId: addVehicle
      summary: Register a vehicle
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleInput' }
      responses:
        '201':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Invalid' }

  /api/me/vehicles/{vehicleId}:
    delete:
      operationId: removeVehicle
      summary: Remove a vehicle
      security: [{ bearer: [] }]
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/me/identity:
    post:
      operationId: startIdentityVerification
      summary: Start identity verification (INE and selfie through the identity provider)
      description: >
        Requires a completed profile (not a vehicle: hosts have none). Sets identityStatus to
        pending. The provider reports the result asynchronously (webhook); clients poll
        GET /api/me until it is verified or rejected.
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/host/spaces:
    get:
      operationId: listHostSpaces
      summary: The signed-in host's own spaces, newest first
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Spaces
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HostSpace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createHostSpace
      summary: Publish a space. It starts in pending_review until back-office approves it
      description: >
        Requires personal data and a verified identity (403 profile_incomplete or
        identity_required). The location must be within the venue's operating radius.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostSpaceCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSpace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The host already published a space at this address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Invalid' }

  /api/host/spaces/{spaceId}:
    patch:
      operationId: updateHostSpace
      summary: Pause or resume a published space, or change its price
      security: [{ bearer: [] }]
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostSpaceUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSpace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A space under review or rejected cannot be paused or resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Invalid' }

  /api/host/bookings:
    get:
      operationId: listHostBookings
      summary: Bookings other drivers made on the host's spaces
      description: Shows the driver's first name, verification badge and car. Never phone, email or ID.
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Bookings, soonest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HostBooking' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Firebase ID token, verified by the backend as a JWT
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The account is not ready for this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Invalid:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, for example space_unavailable
        message: { type: string }
    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }
    Venue:
      type: object
      required: [id, name, area, location, radiusM]
      properties:
        id: { type: string }
        name: { type: string }
        area: { type: string, description: Municipality or neighborhood }
        location: { $ref: '#/components/schemas/LatLng' }
        radiusM: { type: integer, description: Operating radius in meters, at most 3000 }
    VenueEvent:
      type: object
      required: [id, venueId, title, startsAt, endsAt]
      properties:
        id: { type: string }
        venueId: { type: string }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    SpaceFeature:
      type: string
      enum: [covered, gate, camera, ev_charger, lit]
    SpaceSummary:
      type: object
      required:
        [id, title, neighborhood, location, distanceM, priceCentsPerHour, rating, reviewCount, features, photoUrls, available]
      properties:
        id: { type: string }
        title: { type: string }
        neighborhood: { type: string }
        location: { $ref: '#/components/schemas/LatLng' }
        distanceM: { type: integer, description: Meters to the requested venue }
        priceCentsPerHour: { type: integer }
        rating: { type: number }
        reviewCount: { type: integer }
        features:
          type: array
          items: { $ref: '#/components/schemas/SpaceFeature' }
        photoUrls:
          type: array
          items: { type: string }
        available:
          type: boolean
          description: Free for the whole requested window
    Dimensions:
      type: object
      required: [lengthCm, widthCm, heightCm]
      properties:
        lengthCm: { type: integer }
        widthCm: { type: integer }
        heightCm: { type: integer, description: Clear height at the entrance }
    Space:
      allOf:
        - $ref: '#/components/schemas/SpaceSummary'
        - type: object
          required: [description, dimensions, host, vehicleTypes]
          properties:
            description: { type: string }
            dimensions: { $ref: '#/components/schemas/Dimensions' }
            vehicleTypes:
              type: array
              items: { type: string, enum: [compact, sedan, suv, pickup] }
            host:
              type: object
              required: [displayName, verified, memberSince]
              properties:
                displayName: { type: string }
                verified: { type: boolean }
                memberSince: { type: string, format: date }
    Review:
      type: object
      required: [id, authorName, rating, comment, createdAt]
      properties:
        id: { type: string }
        authorName: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        createdAt: { type: string, format: date-time }
    Quote:
      type: object
      required: [subtotalCents, serviceFeeCents, totalCents, minutes]
      properties:
        minutes: { type: integer }
        subtotalCents: { type: integer }
        serviceFeeCents: { type: integer }
        totalCents: { type: integer }
    BookingCreate:
      type: object
      required: [spaceId, startsAt, endsAt, vehicleId]
      properties:
        spaceId: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        vehicleId: { type: string, description: One of the driver's registered vehicles }
    BookingStatus:
      type: string
      enum: [pending_payment, confirmed, cancelled, expired, completed]
    Booking:
      type: object
      required:
        [id, status, space, venueName, startsAt, endsAt, vehicle, subtotalCents, serviceFeeCents, totalCents, expiresAt, accessCode, createdAt]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        space:
          type: object
          required: [id, title, neighborhood, address, photoUrl, spotLabel]
          properties:
            id: { type: string }
            title: { type: string }
            neighborhood: { type: string }
            address:
              type: [string, 'null']
              description: Exact address. Only present once status is confirmed or completed
            photoUrl: { type: [string, 'null'] }
            spotLabel:
              type: [string, 'null']
              description: Where to park inside the property, shown after confirmation
        venueName: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        vehicle: { $ref: '#/components/schemas/Vehicle' }
        subtotalCents: { type: integer }
        serviceFeeCents: { type: integer }
        totalCents: { type: integer }
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: When an unpaid pre-booking is released
        accessCode:
          type: [string, 'null']
          description: Shown once the booking is confirmed
        createdAt: { type: string, format: date-time }
    VehicleType:
      type: string
      enum: [compact, sedan, suv, pickup]
    Vehicle:
      type: object
      required: [id, plate, make, model, color, type]
      properties:
        id: { type: string }
        plate: { type: string }
        make: { type: string }
        model: { type: string }
        color: { type: string }
        type: { $ref: '#/components/schemas/VehicleType' }
    VehicleInput:
      type: object
      required: [plate, make, model, color, type]
      properties:
        plate: { type: string }
        make: { type: string }
        model: { type: string }
        color: { type: string }
        type: { $ref: '#/components/schemas/VehicleType' }
    ProfileInput:
      type: object
      required: [firstName, lastName, birthDate, email, acceptPrivacy]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        birthDate: { type: string, format: date, description: Must be at least 18 years ago }
        email: { type: string, format: email }
        acceptPrivacy:
          type: boolean
          description: Must be true. Records consent to the privacy notice
    IdentityStatus:
      type: string
      enum: [not_started, pending, verified, rejected]
    Me:
      type: object
      required:
        [id, phone, email, firstName, lastName, birthDate, language, privacyAcceptedAt, identityStatus, vehicles]
      properties:
        id: { type: string }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        birthDate: { type: [string, 'null'], format: date }
        language: { type: string, enum: [es-MX, en] }
        privacyAcceptedAt: { type: [string, 'null'], format: date-time }
        identityStatus: { $ref: '#/components/schemas/IdentityStatus' }
        vehicles:
          type: array
          items: { $ref: '#/components/schemas/Vehicle' }
    SpaceStatus:
      type: string
      enum: [pending_review, active, paused, rejected]
    Municipality:
      type: string
      enum: [Zapopan, Guadalajara, San Pedro Tlaquepaque, Tonalá, Tlajomulco de Zúñiga]
    HostSpace:
      type: object
      required:
        [id, status, title, description, venue, street, neighborhood, municipality, references, location, distanceM, dimensions, vehicleTypes, features, priceCentsPerHour, photoUrls, reviewNote, createdAt]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/SpaceStatus' }
        title: { type: string }
        description: { type: string }
        venue:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        street: { type: string, description: Exact address; only the host and confirmed drivers see it }
        neighborhood: { type: string }
        municipality: { $ref: '#/components/schemas/Municipality' }
        references: { type: string, description: Landmarks to find the place; may be empty }
        location: { $ref: '#/components/schemas/LatLng' }
        distanceM: { type: integer }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        vehicleTypes:
          type: array
          items: { $ref: '#/components/schemas/VehicleType' }
        features:
          type: array
          items: { $ref: '#/components/schemas/SpaceFeature' }
        priceCentsPerHour: { type: integer }
        photoUrls:
          type: array
          items: { type: string }
        reviewNote:
          type: [string, 'null']
          description: Why back-office rejected the space, when it did
        createdAt: { type: string, format: date-time }
    HostSpaceCreate:
      type: object
      required:
        [venueId, street, neighborhood, municipality, location, dimensions, vehicleTypes, features, title, description, photoKeys, priceCentsPerHour, acceptHostTerms]
      properties:
        venueId: { type: string }
        street: { type: string }
        neighborhood: { type: string }
        municipality: { $ref: '#/components/schemas/Municipality' }
        references: { type: string }
        location: { $ref: '#/components/schemas/LatLng' }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        vehicleTypes:
          type: array
          items: { $ref: '#/components/schemas/VehicleType' }
        features:
          type: array
          items: { $ref: '#/components/schemas/SpaceFeature' }
        title: { type: string, description: 5 to 60 characters }
        description: { type: string, description: Up to 500 characters }
        photoKeys:
          type: array
          description: Object keys returned by the signed-upload step; 3 to 8 photos
          items: { type: string }
        priceCentsPerHour: { type: integer, description: Between 2000 and 50000 cents }
        acceptHostTerms: { type: boolean, description: Must be true }
    HostSpaceUpdate:
      type: object
      properties:
        status: { type: string, enum: [active, paused] }
        priceCentsPerHour: { type: integer }
    HostBooking:
      type: object
      required: [id, status, space, startsAt, endsAt, driver, subtotalCents, createdAt]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        space:
          type: object
          required: [id, title]
          properties:
            id: { type: string }
            title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        driver:
          type: object
          required: [firstName, identityVerified, vehicle]
