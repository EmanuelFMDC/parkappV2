# Local development and isolated test databases (PostgreSQL 16 + PostGIS).
# Usage (from repo root, with a .env copied from .env.example):
#   docker compose --env-file .env -f infra/docker-compose.yml up -d db
#   docker compose --env-file .env -f infra/docker-compose.yml up -d db_test
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-parkapp}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - parkapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Throwaway database for tests: data lives in memory and disappears on stop.
  db_test:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-parkapp}_test
    ports:
      - '127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}_test']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  parkapp_pgdata:
