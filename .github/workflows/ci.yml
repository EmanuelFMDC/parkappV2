name: CI

# Skeleton: runs lint and tests only. No deploy yet (Phase 6).
# Flow: work on develop -> PR -> merge to main.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: parkapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d parkapp_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for backend project
        id: has_backend
        run: |
          if [ -f backend/pyproject.toml ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.has_backend.outputs.found == 'true'
        with:
          python-version: '3.12'
      - name: Install GDAL (GeoDjango)
        if: steps.has_backend.outputs.found == 'true'
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev
      - name: Install, lint, type-check, test
        if: steps.has_backend.outputs.found == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgis://ci:ci@localhost:5432/parkapp_test
        run: |
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          mypy .
          pytest
