name: CI

# Skeleton: runs lint and tests only. No deploy yet (Phase 6).
# Flow: work on develop_frontend or develop_backend -> PR -> merge to main.
on:
  push:
    branches: [develop_frontend, develop_backend, main]
  pull_request:
    branches: [develop_frontend, develop_backend, main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
